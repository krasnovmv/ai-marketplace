name: Sync upstream plugins

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'
  push:
    branches: [main]
    paths: ['config/upstreams.json']

permissions:
  contents: read

concurrency:
  group: plugin-sync
  cancel-in-progress: false

jobs:
  sync:
    # Enable the schedule after desktop-client acceptance; manual/config runs work immediately.
    if: github.event_name != 'schedule' || vars.MARKETPLACE_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run validate
      - name: Prepare complete candidate and publish one reviewable PR
        run: node --experimental-strip-types scripts/sync-github.ts
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
