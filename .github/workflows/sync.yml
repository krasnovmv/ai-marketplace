name: Sync upstream plugins

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'
  push:
    branches: [main]
    paths: ['config/upstreams.json']

permissions:
  contents: read

concurrency:
  group: plugin-sync
  cancel-in-progress: false

jobs:
  sync:
    # Enable the schedule after desktop-client acceptance; manual/config runs work immediately.
    if: github.event_name != 'schedule' || vars.MARKETPLACE_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run validate
      - name: Prepare complete candidate and publish one reviewable PR
        run: node scripts/sync-github.js
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
